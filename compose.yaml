name: diggoldtitle

services:
  frontend:
    image: ${DOCKERHUB_NAMESPACE:-local}/diggoldtitle-frontend:${IMAGE_TAG:-dev}
    build:
      context: ./web
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:stable-alpine}
        APP_VERSION: ${IMAGE_TAG:-dev}
        VCS_REF: ${VCS_REF:-unknown}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [app]
    restart: unless-stopped

  backend:
    image: ${DOCKERHUB_NAMESPACE:-local}/diggoldtitle-backend:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim}
        APP_VERSION: ${IMAGE_TAG:-dev}
        VCS_REF: ${VCS_REF:-unknown}
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: news_app
      MYSQL_USER: news_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      REDIS_HOST: redis
      SQL_ECHO: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [app, data]
    restart: unless-stopped

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    environment:
      MYSQL_DATABASE: news_app
      MYSQL_USER: news_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u news_app news_app -e 'SELECT 1 FROM news_category LIMIT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks: [data]
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [data]
    restart: unless-stopped

networks:
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  mysql_data:
