name: Build and integration checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MYSQL_PASSWORD: ci-app-password
      MYSQL_ROOT_PASSWORD: ci-root-password
      DOCKERHUB_NAMESPACE: local
      IMAGE_TAG: ci
      VCS_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Compose and build images
        run: |
          docker compose config --quiet
          docker compose build
      - name: Start isolated stack
        run: docker compose up -d --no-build --wait --wait-timeout 180
      - name: Check HTTP and dependencies
        run: |
          python3 scripts/smoke_test.py
          docker compose exec -T backend pip check
          docker compose exec -T redis redis-cli ping
      - name: Show diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Clean up CI resources
        if: always()
        run: docker compose down -v
